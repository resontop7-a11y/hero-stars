<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>Hero Stars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}

@media screen and (orientation: portrait) {
  body::before {
    content: "🔄 ПОВЕРНИТЕ ЭКРАН";position:fixed;top:0;left:0;width:100%;height:100%;
    background:#0a1628;color:#ffd700;font-size:20px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;z-index:99999;text-align:center;padding:20px;
  }
  #lobby,#loading{display:none!important}
}

#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a1628;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
#loading .icon{font-size:70px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
#loading .title{font-size:36px;font-weight:900;letter-spacing:6px;color:#00d4ff}
#loading .bar-bg{width:260px;height:10px;background:rgba(255,255,255,.2);border-radius:10px}
#loading .bar{width:0%;height:100%;background:#ffd700;border-radius:10px;transition:width .3s}
#loading .sub{color:#aaa;font-size:14px}

#lobby{display:none;width:100vw;height:100vh;background:linear-gradient(135deg,#0d1f3c,#061220);position:relative}

.avatar-btn{position:absolute;top:18px;left:20px;z-index:10;width:52px;height:52px;border-radius:50%;background:rgba(0,212,255,.15);border:2px solid #00d4ff;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;color:#fff;transition:.2s}
.avatar-btn:hover{box-shadow:0 0 20px rgba(0,212,255,.4)}

.fame-path{position:absolute;top:22px;left:85px;z-index:10;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);transition:.2s;overflow:hidden;width:160px}
.fame-path:hover{background:rgba(255,215,0,.12);border-color:#ffd700}
.fame-path .fp-icon{font-size:16px;flex-shrink:0}
.fame-path .fp-bar{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.fame-path .fp-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00);border-radius:10px;width:0%;transition:width .8s}
.fame-path .fp-text{color:#ffd700;font-size:10px;font-weight:bold;white-space:nowrap;flex-shrink:0}

/* МОНЕТЫ И КРИСТАЛЛЫ */
.resources{position:absolute;top:20px;right:80px;z-index:10;display:flex;gap:12px}
.res-item{display:flex;align-items:center;gap:4px;color:#fff;font-size:13px;font-weight:bold;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:12px}
.res-item .res-icon{font-size:16px}

.burger-btn{position:absolute;top:18px;right:20px;z-index:10;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.burger-btn:hover{background:rgba(0,212,255,.2)}

.right-side{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:10}
.rbtn{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.rbtn:hover{background:rgba(0,212,255,.2);border-color:#00d4ff}

.left-panel{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:10}
.lbtn{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.lbtn:hover{background:rgba(0,212,255,.2);border-color:#00d4ff}

.hero-area{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
/* РАНГ НАД ГЕРОЕМ */
.hero-rank{color:#ffd700;font-size:11px;font-weight:bold;margin-bottom:2px}
.hero-rank-bar{width:90px;height:4px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin-bottom:4px}
.hero-rank-fill{height:100%;background:#ffd700;border-radius:5px;width:0%;transition:width .8s}
.hero-box{width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:48px;background:rgba(0,212,255,.1);cursor:pointer;transition:.2s}
.hero-box:hover{border-color:#00d4ff;box-shadow:0 0 25px rgba(0,212,255,.3)}
.hero-nick{color:#fff;font-size:17px;font-weight:bold}

.invite-left{position:absolute;top:50%;left:50%;transform:translate(calc(-50% - 80px),-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,200,100,.15);border:2px solid #0c8;color:#0c8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:5}
.invite-right{position:absolute;top:50%;left:50%;transform:translate(calc(-50% + 80px),-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,200,100,.15);border:2px solid #0c8;color:#0c8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:5}

.play-btn{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 50px;background:#ffd700;color:#000;border:none;border-radius:25px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #b8960b;transition:.1s;z-index:10}
.play-btn:hover{transform:translateX(-50%) translateY(-2px)}
.play-btn:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #b8960b}

.guest-badge{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px;color:#fff;font-size:13px;border:1px solid rgba(0,200,100,.3);z-index:10}

/* ПАНЕЛИ */
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(5,15,30,.98);color:#fff;padding:20px;border-radius:18px;z-index:50;display:none;text-align:center;min-width:300px;max-width:90vw;max-height:80vh;overflow-y:auto;border:1px solid rgba(255,255,255,.2)}
.panel h3{color:#ffd700;margin-bottom:10px;font-size:17px}
.panel .close-btn{background:red!important;text-align:center!important;font-weight:bold;display:block;width:100%;margin-top:10px;padding:10px;border:none;color:#fff;border-radius:10px;font-size:14px;cursor:pointer}

.mode-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;margin:6px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);color:#fff;border-radius:14px;font-size:14px;cursor:pointer;text-align:left;transition:.2s}
.mode-card:hover{background:rgba(0,212,255,.15);border-color:#00d4ff}

.lb-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.lb-tabs button{padding:5px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-size:11px}
.lb-tabs button.active{background:rgba(0,212,255,.3);border-color:#00d4ff;font-weight:bold}
.lb-list{text-align:left;max-height:220px;overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;margin:1px 0;font-size:12px;cursor:pointer}
.lb-row:hover{background:rgba(255,255,255,.06)}
.lb-row:nth-child(odd){background:rgba(255,255,255,.03)}
.lb-rank{width:22px;font-weight:bold;color:#ffd700}
.lb-avatar{font-size:16px}
.lb-name{flex:1;color:#fff}
.lb-score{color:#ffd700;font-weight:bold}

/* ДРУЗЬЯ */
.friends-layout{display:flex;gap:12px}
.friends-left{flex:1;text-align:left}
.friends-right{flex:1;text-align:left}
.friend-card{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:8px;margin:3px 0;cursor:pointer;font-size:12px;color:#fff}
.friend-card:hover{background:rgba(0,212,255,.15)}
.friend-card .fc-avatar{font-size:18px}
.friend-card .fc-name{flex:1}

.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.hc{padding:8px;background:rgba(255,255,255,.06);border-radius:10px;cursor:pointer;text-align:center;transition:.15s}
.hc:hover{background:rgba(0,212,255,.2)}
.hc.owned{border:2px solid #ffd700}
.hc.locked{opacity:.4}
.hc .he{font-size:26px}
.hc .hn{color:#fff;font-size:10px}

.reward-popup{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;color:#ffd700;padding:14px 24px;border-radius:12px;z-index:60;font-weight:bold;font-size:14px;animation:popIn .3s,popOut .3s 1.8s forwards;pointer-events:none}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popOut{from{opacity:1}to{opacity:0}}

#game{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:#000;z-index:40}
canvas{border:2px solid #00d4ff;max-width:100vw;max-height:100vh}
#gui{position:absolute;top:8px;left:8px;color:#fff;font-size:13px;z-index:41;pointer-events:none;display:flex;gap:8px}
#back{position:absolute;top:8px;right:8px;background:red;color:#fff;border:none;padding:6px 12px;border-radius:50%;font-size:14px;z-index:42;cursor:pointer}
#js{position:absolute;bottom:25px;left:25px;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%;border:2px solid rgba(255,255,255,.2);z-index:42;display:none}
#jk{position:absolute;width:40px;height:40px;background:rgba(255,255,255,.35);border-radius:50%;top:30px;left:30px}
#atk{position:absolute;bottom:45px;right:25px;width:65px;height:65px;background:rgba(255,50,50,.5);border-radius:50%;border:3px solid #f44;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;z-index:42}
</style>
</head>
<body>

<div id="loading">
  <div class="icon">⚔️</div>
  <div class="title">HERO STARS</div>
  <div class="bar-bg"><div class="bar" id="loadbar"></div></div>
  <div class="sub" id="loadsub">Загрузка...</div>
</div>

<div id="lobby">
  <div class="avatar-btn" id="avatar-btn" onclick="openProfile()">🔥</div>
  <div class="fame-path" onclick="openFameRewards()">
    <span class="fp-icon">🏆</span>
    <div class="fp-bar"><div class="fp-fill" id="fpfill"></div></div>
    <span class="fp-text" id="fptext">0/10K</span>
  </div>
  <div class="resources">
    <div class="res-item"><span class="res-icon">💎</span><span id="gems-display">0</span></div>
    <div class="res-item"><span class="res-icon">🪙</span><span id="coins-display">500</span></div>
  </div>
  <div class="burger-btn" onclick="openBurger()">☰</div>

  <div class="left-panel">
    <button class="lbtn" onclick="openShop()">🛒</button>
    <button class="lbtn" onclick="openHeroes()">👥</button>
    <button class="lbtn" onclick="openNews()">📰</button>
  </div>

  <div class="right-side">
    <button class="rbtn" onclick="openClub()">👥</button>
    <button class="rbtn" onclick="openFriends()">👫</button>
  </div>

  <div class="invite-left" onclick="openInvite()">+</div>
  <div class="invite-right" onclick="openInvite()">+</div>

  <div class="hero-area">
    <div class="hero-rank" id="hero-rank-text">БРОНЗА 1</div>
    <div class="hero-rank-bar"><div class="hero-rank-fill" id="hero-rank-fill"></div></div>
    <div class="hero-box" id="hbox" onclick="openHeroes()">🔥</div>
    <div class="hero-nick" id="hname">Огонёк</div>
  </div>

  <button class="play-btn" onclick="openModes()">▶ ИГРАТЬ</button>
  <div class="guest-badge" id="guest-badge"></div>
</div>

<!-- ПАНЕЛИ -->
<div class="panel" id="modes-panel">
  <h3>ВЫБОР РЕЖИМА</h3><div id="mode-list"></div>
  <div id="selected-mode" style="color:#ffd700;font-size:12px;margin-top:6px"></div>
  <button class="close-btn" onclick="closeModes()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="profile-panel">
  <div class="prof-avatar" id="prof-avatar" style="width:70px;height:70px;border-radius:50%;margin:0 auto;background:rgba(0,212,255,.15);border:2px solid #00d4ff;display:flex;align-items:center;justify-content:center;font-size:36px">🔥</div>
  <div class="prof-tag" id="prof-tag" style="color:#aaa;font-size:12px">#TAG</div>
  <div class="prof-nick" id="prof-nick" style="color:#fff;font-size:16px;font-weight:bold">Огонёк</div>
  <button class="change-btn" onclick="showAvatarPicker()">🖼 Аватар</button>
  <button class="change-btn" onclick="showNickChange()">✏ Ник</button>
  <div id="avatar-picker" style="display:none"></div>
  <div id="nick-changer" style="display:none"></div>
  <div class="stat-card"><div class="stat-row"><span>🏆 Макс</span><span class="stat-val" id="stat-max">0</span></div><div class="stat-row"><span>⏱ Часов</span><span class="stat-val" id="stat-hours">0</span></div><div class="stat-row"><span>🔢 Заходов</span><span class="stat-val" id="stat-logins">1</span></div></div>
  <div class="rank-badge" id="rank-badge" style="background:linear-gradient(135deg,#cd7f32,#8b5a2b);padding:5px 14px;border-radius:12px;color:#fff;font-weight:bold;font-size:13px">🥉 БРОНЗА 1</div>
  <div class="rank-elo" id="rank-elo" style="color:#aaa;font-size:11px">0 ELO</div>
  <button class="close-btn" onclick="closeProfile()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="burger-panel">
  <h3>☰ МЕНЮ</h3>
  <button class="mode-card" onclick="openLeaderboardP()"><span class="mc-icon">🏆</span> Списки лидеров</button>
  <button class="mode-card" onclick="openSettings()"><span class="mc-icon">⚙️</span> Настройки</button>
  <button class="mode-card" onclick="openNotifications()"><span class="mc-icon">🔔</span> Уведомления</button>
  <button class="close-btn" onclick="closeBurger()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="leaderboard-panel">
  <h3>🏆 ЛИДЕРЫ</h3>
  <div class="lb-tabs" id="lb-tabs"></div>
  <div class="lb-list" id="lb-list"></div>
  <button class="close-btn" onclick="closeLeaderboard()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="fame-panel">
  <h3>🎁 ПУТЬ К СЛАВЕ</h3>
  <div class="fame-scroll" id="fame-scroll" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:200px;overflow-y:auto"></div>
  <div class="fame-track"><div class="fame-track-fill" id="fame-track-fill" style="height:6px;background:linear-gradient(90deg,#ffd700,#ffaa00);border-radius:10px;width:0%"></div></div>
  <button class="close-btn" onclick="closeFame()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="settings-panel">
  <h3>⚙️ НАСТРОЙКИ</h3>
  <div class="settings-group"><label>Язык</label><select id="lang-select" onchange="changeLanguage(this.value)"><option value="ru">🇷🇺 Русский</option><option value="en">🇺🇸 English</option></select></div>
  <div class="settings-group"><label>Регион</label><select id="region-select" onchange="changeRegion(this.value)"><option value="US">🇺🇸 США</option><option value="UA">🇺🇦 Украина</option><option value="RU">🇷🇺 Россия</option><option value="KZ">🇰🇿 Казахстан</option></select></div>
  <button class="close-btn" onclick="closeSettings()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="invite-panel">
  <h3>📨 ПРИГЛАШЕНИЕ</h3>
  <button class="mode-card" onclick="inviteFriend()"><span class="mc-icon">📤</span> Пригласить друга</button>
  <button class="mode-card" onclick="joinByCode()"><span class="mc-icon">📥</span> Вступить по коду</button>
  <button class="close-btn" onclick="closeInvite()">ЗАКРЫТЬ</button>
</div>

<div class="panel" id="panel">
  <h3 id="ptitle"></h3><div id="pbody"></div>
  <button onclick="closePanel()">Закрыть</button>
</div>

<div id="game">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="gui"><span>🏆<span id="gt">0</span></span><span>❤️<span id="gh">100</span></span><span id="gs">Бой</span><span id="gm"></span></div>
  <div id="js"><div id="jk"></div></div>
  <div id="atk">⚔</div>
  <button id="back" onclick="leave()">✕</button>
</div>

<script>
function lockLandscape(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}
document.addEventListener('click',lockLandscape,{once:true});
document.addEventListener('touchstart',lockLandscape,{once:true});
</script>
<script src="game.js"></script>
</body>
</html>
