<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Stars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0a1628;font-family:Arial,sans-serif;
width:100vw;height:100vh;overflow:hidden;
display:flex;justify-content:center;align-items:center;
user-select:none;-webkit-user-select:none;
}

/* ЗАГРУЗКА */
#loading{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#0a1628;z-index:999;
display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:20px;color:#fff;
}
#loading .icon{font-size:70px}
#loading .title{font-size:36px;font-weight:900;letter-spacing:6px;color:#00d4ff}
#loading .bar-bg{width:260px;height:10px;background:rgba(255,255,255,.2);border-radius:10px}
#loading .bar{width:0%;height:100%;background:#ffd700;border-radius:10px}
#loading .sub{color:#aaa;font-size:14px}

/* ЛОББИ - ВСЕГДА ГОРИЗОНТАЛЬНО */
#lobby{
display:none;width:100vw;height:100vh;
background:linear-gradient(to bottom,#0d1f3c,#061220);
flex-direction:row;align-items:center;justify-content:center;
gap:30px;padding:20px;
}

/* ЛЕВЫЙ + */
.left-plus{
width:70px;height:70px;border-radius:50%;
background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);
color:#fff;font-size:36px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
flex-shrink:0;
}

/* ЦЕНТР */
.center-col{
display:flex;flex-direction:column;align-items:center;gap:18px;
}
.hero-box{
width:130px;height:130px;border-radius:50%;
border:3px solid rgba(255,255,255,.2);
display:flex;align-items:center;justify-content:center;
font-size:55px;background:rgba(0,212,255,.1);
}
.hero-name{color:#fff;font-size:20px;font-weight:bold}

/* КНОПКА РЕЖИМЫ */
.modes-btn{
padding:12px 30px;background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.2);color:#fff;
border-radius:20px;font-size:16px;cursor:pointer;font-weight:bold;
}

/* ПРАВЫЙ + */
.right-plus{
width:70px;height:70px;border-radius:50%;
background:rgba(0,200,100,.2);border:2px solid #0c8;
color:#0c8;font-size:36px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
flex-shrink:0;
}

/* ПАНЕЛЬ РЕЖИМОВ */
#modes-panel{
position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(5,15,30,.98);color:#fff;padding:25px;
border-radius:20px;z-index:50;display:none;
text-align:center;min-width:280px;
border:1px solid rgba(255,255,255,.2);
}
#modes-panel h3{color:#ffd700;margin-bottom:15px;font-size:20px}
#modes-panel button{
display:block;width:100%;margin:8px 0;padding:12px;
background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
color:#fff;border-radius:12px;font-size:15px;cursor:pointer;text-align:left;
}
#modes-panel .close-btn{
background:red;text-align:center;margin-top:10px;font-weight:bold;
}

/* ПАНЕЛЬ (магазин, герои) */
#panel{
position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(5,15,30,.98);color:#fff;padding:25px;
border-radius:20px;z-index:50;display:none;
text-align:center;min-width:280px;max-height:70vh;overflow-y:auto;
border:1px solid rgba(255,255,255,.2);
}
#panel h3{color:#ffd700;margin-bottom:15px}
#panel button{
margin-top:10px;padding:8px 25px;background:#00d4ff;
border:none;border-radius:15px;color:#000;font-weight:bold;cursor:pointer;
}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hc{padding:10px;background:rgba(255,255,255,.06);border-radius:12px;cursor:pointer;text-align:center}
.hc.owned{border:2px solid #ffd700}
.hc.locked{opacity:.4}
.hc .he{font-size:30px}
.hc .hn{color:#fff;font-size:11px;margin-top:3px}

/* ИГРА */
#game{
position:fixed;top:0;left:0;width:100%;height:100%;
display:none;justify-content:center;align-items:center;
background:#000;z-index:40;
}
canvas{border:2px solid #00d4ff;max-width:100vw;max-height:100vh}
#gui{position:absolute;top:8px;left:8px;color:#fff;font-size:13px;z-index:41;pointer-events:none;display:flex;gap:8px}
#back{position:absolute;top:8px;right:8px;background:red;color:#fff;border:none;padding:6px 12px;border-radius:50%;font-size:14px;z-index:42;cursor:pointer}
#js{position:absolute;bottom:25px;left:25px;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%;border:2px solid rgba(255,255,255,.2);z-index:42;display:none}
#jk{position:absolute;width:40px;height:40px;background:rgba(255,255,255,.35);border-radius:50%;top:30px;left:30px}
#atk{position:absolute;bottom:45px;right:25px;width:65px;height:65px;background:rgba(255,50,50,.5);border-radius:50%;border:3px solid #f44;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;z-index:42}
</style>
</head>
<body>

<!-- ЗАГРУЗКА -->
<div id="loading">
  <div class="icon">⚔️</div>
  <div class="title">HERO STARS</div>
  <div class="bar-bg"><div class="bar" id="loadbar"></div></div>
  <div class="sub" id="loadsub">Загрузка...</div>
</div>

<!-- ЛОББИ -->
<div id="lobby">
  <div class="left-plus" onclick="openShop()">+</div>

  <div class="center-col">
    <div class="hero-box" id="hbox">🔥</div>
    <div class="hero-name" id="hname">Огонёк</div>
    <button class="modes-btn" onclick="openModes()">⚔️ РЕЖИМЫ</button>
  </div>

  <div class="right-plus" onclick="invite()">+</div>
</div>

<!-- ПАНЕЛЬ РЕЖИМОВ -->
<div id="modes-panel">
  <h3>ВЫБОР РЕЖИМА</h3>
  <button onclick="go('showdown')">💀 Столкновение</button>
  <button onclick="go('brawlball')">⚽ Броуболл</button>
  <button onclick="go('gemgrab')">💎 Захват кристаллов</button>
  <button onclick="go('knockout')">🥊 Нокаут</button>
  <button class="close-btn" onclick="closeModes()">ЗАКРЫТЬ</button>
</div>

<!-- ПАНЕЛЬ -->
<div id="panel">
  <h3 id="ptitle"></h3>
  <div id="pbody"></div>
  <button onclick="closePanel()">Закрыть</button>
</div>

<!-- ИГРА -->
<div id="game">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="gui"><span>🏆<span id="gt">0</span></span><span>❤️<span id="gh">100</span></span><span id="gs">Бой</span><span id="gm"></span></div>
  <div id="js"><div id="jk"></div></div>
  <div id="atk">⚔</div>
  <button id="back" onclick="leave()">✕</button>
</div>

<script src="game.js"></script>
</body>
</html>
